services:
  postgres_db:
    image: postgres:15-alpine
    container_name: cpd_postgres
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=cpd_user
      - POSTGRES_PASSWORD=cpd_pass
      - POSTGRES_DB=cpd_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cpd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpd_user -d cpd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: cpd_airflow
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://cpd_user:cpd_pass@postgres_db:5432/cpd_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Student --lastname Lab --role Admin --email admin@lab.edu || true &&
      (airflow scheduler &) &&
      exec airflow webserver --port 8080"
    networks:
      - cpd_network

  metabase:
    image: metabase/metabase:latest
    container_name: cpd_metabase
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    networks:
      - cpd_network

volumes:
  pgdata:
  metabase_data:

networks:
  cpd_network:
    driver: bridge
